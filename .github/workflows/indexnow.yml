name: Notify IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deployment
        run: sleep 90

      - name: Notify IndexNow
        shell: bash
        run: |
          set -e
          KEY="51e174a18a494282a73cbac6c48e4bf3"
          KEY_LOCATION="https://missnemesis79.github.io/Shelterai-/51e174a18a494282a73cbac6c48e4bf3.txt"
          submit() {
            URL="$1"
            for attempt in 1 2 3 4 5; do
              CODE=$(curl -sS -o /tmp/indexnow-response.txt -w "%{http_code}"                 "https://api.indexnow.org/indexnow?url=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$URL")&key=$KEY&keyLocation=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$KEY_LOCATION")")
              echo "$URL -> HTTP $CODE"
              if [ "$CODE" = "200" ] || [ "$CODE" = "202" ]; then
                return 0
              fi
              sleep 30
            done
            cat /tmp/indexnow-response.txt || true
            return 1
          }

          submit "https://missnemesis79.github.io/Shelterai-/"
          submit "https://missnemesis79.github.io/Shelterai-/shelter.txt"
          submit "https://missnemesis79.github.io/Shelterai-/llms.txt"
          submit "https://missnemesis79.github.io/Shelterai-/sitemap.xml"
